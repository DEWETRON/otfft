name: CMake

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # every entry is one job; the AVX-512 backend (roadmap R2.1) is built and tested on Linux, the
        # tests that need AVX-512 hardware run only if the runner has it
        include:
          - os: windows-latest
            name: windows-latest, clang-cl
            cmake-flags: -T ClangCL

    steps:
    - uses: actions/checkout@v4

    - name: Find libomp
      shell: pwsh
      run: |
        Get-ChildItem -Recurse -ErrorAction SilentlyContinue -Include libomp*,libiomp* -Path 'C:\Program Files\LLVM','C:\Program Files\Microsoft Visual Studio','C:\msys64\clang64','C:\Program Files (x86)\Microsoft Visual Studio' | Select-Object -First 40 FullName
        clang-cl --version
        Get-Command clang-cl | Select-Object Source

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{ matrix.cmake-flags }}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
